name: Embed docs to Qdrant

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: bge-large-en-v1.5

      - name: Cache context prefixes
        uses: actions/cache@v4
        with:
          path: tooling/embed/.prefix_cache.json
          key: prefixes-${{ hashFiles('docs/**') }}
          restore-keys: prefixes-

      - name: Install dependencies
        run: pip install -r tooling/embed/requirements.txt

      - name: Embed and upload
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: python tooling/embed/embed_and_upload.py
